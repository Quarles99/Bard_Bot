server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass" # overridden by the LAVALINK_SERVER_PASSWORD env var set in docker-compose.yml
    sources:
      youtube: false # handled by the youtube-plugin below instead
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      # Left disabled: it lets /play fetch an arbitrary attacker-supplied
      # host/URL (not just a path) from the Lavalink server, which is a
      # server-side request forgery primitive against whatever the
      # deployment's network exposes outbound. None of the supported
      # platforms above need it - they have their own source handlers.
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      timescale: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 6
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - TV # only client that actually uses the OAuth token for playback
      # TV's own OAuth-gated playback currently fails login-gated videos with
      # "The page needs to be reloaded" — open upstream bug, not fixable via
      # config: https://github.com/lavalink-devs/youtube-source/issues/226
      # (also: no client both loads metadata and supports OAuth, so even a
      # fix here wouldn't be enough on its own — see ../../POSTMORTEM.md)
    oauth:
      enabled: true
      # refreshToken is supplied via the YOUTUBE_OAUTH_REFRESH_TOKEN env var
      # (see docker-compose.yml) so it never ends up committed to git.
    remoteCipher:
      # Offloads YouTube's signature-cipher solving to avoid needing to chase
      # every YouTube player-script change ourselves. Free public instance,
      # rate-limited to 10 req/sec - plenty for light usage. Self-host
      # https://github.com/kikkia/yt-cipher later if that's ever a bottleneck.
      url: "https://cipher.kikkia.dev/"
      userAgent: "bard-bot"

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
